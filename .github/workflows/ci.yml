name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"

jobs:
  lint:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run eslint -- --max-warnings=0

      - name: Typecheck files
        run: npm run typecheck

      - name: Format check
        run: npm run prettier -- --check

  build-library:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: npm run ionic:build

      - name: Verify build
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "The 'dist' folder is out of sync. Please run 'npm run build' locally and commit the changes."
            git status dist
            git diff dist
            exit 1
          fi

  build-android:
    name: Build Android Example
    runs-on: ubuntu-latest
    needs: build-library
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Build Plugin
        run: npm run build

      - name: Build web assets
        run: npm run build
        working-directory: example

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: example

      - name: Build Android App
        run: ./gradlew assembleRelease
        working-directory: example/android

      - name: 🔑 License backend hint
        if: failure()
        run: |
          echo "::warning::The example app applies app.talsec.plugin, which requests a license token from portal-backend.talsec.app during the build."
          echo "::warning::If the log shows 'Cannot resolve license', check that the backend is up and reachable from the runner before investigating this PR."

  build-ios:
    name: Build iOS Example (${{ matrix.package-manager }})
    runs-on: macos-latest
    needs: build-library
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-manager: Cocoapods
            xcode-option: -workspace
            xcode-container: ios/App/App.xcworkspace
          - package-manager: SPM
            xcode-option: -project
            xcode-container: ios/App/App.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Plugin
        run: npm run build

      - name: Build web assets
        run: npm run build
        working-directory: example

      - name: Create iOS project
        run: |
          rm -rf ios
          npx cap add ios --packagemanager "${{ matrix.package-manager }}"
        working-directory: example

      - name: Build iOS App
        run: xcodebuild "${{ matrix.xcode-option }}" "${{ matrix.xcode-container }}" -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
        working-directory: example
